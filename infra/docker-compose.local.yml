# LOCAL DEV ONLY (Windows / macOS Docker Desktop).
#
# Why this file exists separately from docker-compose.yml:
#
#   The production file uses `network_mode: host`, which LiveKit's docs require
#   because of the ~10,000-port UDP range SIP needs. On Docker Desktop
#   (Windows/macOS) "host" is the Linux VM's network, NOT the Windows/macOS
#   host's — so host mode breaks both service-to-service DNS and browser access
#   from the desktop. This file uses bridge networking with published ports
#   instead, which works on Docker Desktop.
#
#   It also omits the SIP bridge entirely: SIP/Twilio is only meaningful with a
#   publicly reachable address, so it belongs on the VPS. This file is purely
#   for confirming the LiveKit media server works and a browser can join a room.
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#
# Production (Linux VPS) still uses:
#   docker compose up -d

services:
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # Deliberately NOT published to the host — livekit reaches it over the
    # compose bridge network by service name, avoiding any clash with another
    # Redis already running on this machine.
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    depends_on:
      - redis
    ports:
      - "7880:7880"              # signaling / API
      - "7881:7881"              # RTC over TCP
      - "50000-50019:50000-50019/udp"  # RTC media (small range; Docker Desktop
                                       # is slow to map large port ranges)
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50019
          use_external_ip: false
          node_ip: 127.0.0.1
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    restart: unless-stopped
