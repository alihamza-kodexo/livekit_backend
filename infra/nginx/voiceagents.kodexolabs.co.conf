# nginx for voiceagents.kodexolabs.co
#
# Two hostnames on one box, because they cannot share one:
#
#   voiceagents.kodexolabs.co      -> the Next.js dashboard on 127.0.0.1:3001
#   rtc.voiceagents.kodexolabs.co  -> LiveKit signaling on 127.0.0.1:7880
#
# 3001, not 3000: that's the port the deployed dashboard actually listens on
# (confirmed from `ufw status`, which allows 3001 from the Docker bridge, and
# from `ss -lntp` on the box). Check it with `ss -lntp | grep node` before
# installing this -- a wrong port here is a 502 on every request.
#
# The second one is not optional once the first has a certificate. The test
# panel hands LIVEKIT_URL to the browser, and a page loaded over HTTPS is not
# allowed to open a ws:// socket -- Chrome blocks it as mixed content with no
# prompt. So the moment the dashboard is on TLS, web test calls need wss://,
# which needs a name a certificate can be issued for. They could be one
# hostname with LiveKit routed by path, but /rtc and /twirp are then permanently
# carved out of the app's routing, and a future Next.js route quietly shadows
# call signaling. Two names costs one DNS record and avoids that entirely.
#
# Install:
#   sudo cp voiceagents.kodexolabs.co.conf /etc/nginx/sites-available/voiceagents
#   sudo ln -sf /etc/nginx/sites-available/voiceagents /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# The TLS lines below are added by certbot, not by hand -- see infra/README.md.
# Run certbot after this file is in place and nginx has reloaded once on :80.

# --- Dashboard ---------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name voiceagents.kodexolabs.co;

    # Recordings are uploaded by the worker, not through here, so the default
    # 1MB body limit is fine for everything the dashboard actually posts.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Next.js reads this to know it is behind TLS. Without it, Supabase auth
        # cookies get issued without the Secure flag and every redirect the app
        # builds comes back as http://, which downgrades the session mid-login.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Server actions and RSC streams are long-lived responses; buffering
        # them makes the dashboard feel like it hangs on every mutation.
        proxy_buffering off;
    }
}

# --- LiveKit signaling -------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name rtc.voiceagents.kodexolabs.co;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        # The websocket upgrade. Everything about a LiveKit session rides this
        # one socket -- without these two headers the room join fails with a
        # plain 400 and nothing in the LiveKit log explains why.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A signaling socket is idle whenever nobody is talking, and nginx's
        # 60s default read timeout would drop it mid-call. LiveKit sends its own
        # pings; this just has to outlast them.
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        proxy_buffering off;
    }
}

# Deliberately NOT proxied here:
#
#   - Media (UDP 50000-60000). WebRTC media never goes through nginx; it flows
#     directly to the host's IP, which is why rtc.use_external_ip stays true and
#     those ports stay open on the firewall. Proxying signaling changes nothing
#     about where audio goes.
#   - SIP (UDP 5060) and RTP (10000-20000). Twilio speaks SIP, not HTTP, so the
#     Origination URI stays sip:<ip>:5060 and is unaffected by any of this.
#   - Egress and the SIP bridge's own ws_url. Both are on this box and reach
#     LiveKit over ws://localhost:7880 -- routing them out through nginx and
#     back in would add a TLS handshake to a loopback call for nothing.
