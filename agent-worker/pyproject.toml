[project]
name = "kodexo-voice-agent-worker"
version = "0.1.0"
description = "LiveKit agent worker: STT (Deepgram) -> LLM (Groq) -> TTS (Deepgram Aura) inbound sales-qualification voice agent"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.0",
    "livekit-plugins-deepgram",
    "livekit-plugins-silero",
    "livekit-plugins-groq",
    "livekit-plugins-google",  # Gemini Live -- opt-in realtime engine, see VOICE_STACK_DECISION.md
    # Arrives with the plugin above anyway, but entrypoint.py imports it
    # directly to build Gemini's activity-detection config, so it's a real
    # first-order dependency rather than a transitive one.
    "google-genai",
    "livekit-plugins-noise-cancellation",
    "supabase>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["worker"]
